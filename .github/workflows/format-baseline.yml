# Temporary branch-only workflow to establish the formatting baseline.
# This file will be removed from the PR after the formatting commit lands.
name: Normalize Rust formatting baseline
on:
  push:
    branches:
      - feature/issue-5-windows-ci
    paths:
      - .github/workflows/format-baseline.yml

permissions:
  contents: write

jobs:
  apply-rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-5-windows-ci
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Normalize and commit Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if ! git diff --quiet -- src; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src
            git commit -m 'style: normalize existing Rust formatting baseline'
            git push origin HEAD:feature/issue-5-windows-ci
          fi
