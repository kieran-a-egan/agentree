name: Bootstrap roadmap milestones

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-roadmap.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync-roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Create release milestones and assign issues
        uses: actions/github-script@v7
        with:
          script: |
            const releases = new Map([
              ['v0.5', 'Configuration & core contracts'],
              ['v0.6', 'Portable roles, Agent Plugins & AGENTS.md'],
              ['v0.7', 'Multi-provider runtime & local models'],
              ['v0.8', 'System One decision-engine interface'],
              ['v0.9', 'Reliability, governance & reproducibility'],
              ['v1.0', 'Stable public release'],
            ]);
            const existing = await github.paginate(github.rest.issues.listMilestones, {
              ...context.repo, state: 'all', per_page: 100,
            });
            const byTitle = new Map(existing.map(m => [m.title, m.number]));
            for (const [title, description] of releases) {
              if (byTitle.has(title)) continue;
              const {data} = await github.rest.issues.createMilestone({
                ...context.repo, title, description,
              });
              byTitle.set(title, data.number);
              core.info(`Created milestone ${title} (#${data.number})`);
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', per_page: 100,
            });
            let linked = 0;
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const match = issue.title.match(/^\[(v0\.[5-9]|v1\.0)\]\s/);
              if (!match) continue;
              const milestone = byTitle.get(match[1]);
              if (!milestone || issue.milestone?.number === milestone) continue;
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, milestone,
              });
              linked++;
            }
            core.info(`Linked ${linked} issues across ${releases.size} roadmap milestones.`)
